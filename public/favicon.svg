<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient (Deep Obsidian Navy) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1424"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Outer Squircle Vibrant Gradient (Indigo to Royal Electric Blue) -->
    <linearGradient id="squircleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="45%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Inner Border Specular Highlight -->
    <linearGradient id="innerHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Test Box Frame Surface Gradient -->
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>

    <!-- Verification Check & Arrow Gradient (Emerald to Mint) -->
    <linearGradient id="checkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="35%" stop-color="#10b981"/>
      <stop offset="75%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#6ee7b7"/>
    </linearGradient>

    <!-- Soft Drop Shadows -->
    <filter id="outerShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4f46e5" flood-opacity="0.3"/>
    </filter>

    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#10b981" flood-opacity="0.55"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#10b981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Dark Canvas (Ensures crisp contrast in both dark and light browser tabs) -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="114" stroke="#1e293b" stroke-width="2" fill="none"/>

  <!-- Main Squircle Emblem -->
  <rect x="52" y="52" width="408" height="408" rx="94" fill="url(#squircleGrad)" filter="url(#outerShadow)"/>
  
  <!-- Subtle Inner Bevel / Rim -->
  <rect x="54" y="54" width="404" height="404" rx="92" stroke="url(#innerHighlight)" stroke-width="4" fill="none"/>

  <!-- Inset QA Test Chamber Box -->
  <rect x="108" y="108" width="296" height="296" rx="46" fill="url(#boxGrad)"/>
  <rect x="108" y="108" width="296" height="296" rx="46" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.3" fill="none"/>

  <!-- QA Test Container Frame Bracket with Top-Right Launch Exit -->
  <path d="M 306 166 L 180 166 C 158 166 142 182 142 204 L 142 308 C 142 330 158 346 180 346 L 302 346 C 324 346 340 330 340 308 L 340 242" 
        stroke="#60a5fa" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" 
        opacity="0.95"/>

  <!-- Verification Checkmark + Launching Pilot Arrow Flight Path -->
  <!-- Checkmark Tail to Apex -->
  <path d="M 194 266 L 246 318 L 366 162" 
        stroke="url(#checkGrad)" 
        stroke-width="32" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#emeraldGlow)"/>

  <!-- Pilot Arrowhead / Directional Flight Tip -->
  <path d="M 334 150 L 378 150 L 378 194" 
        stroke="url(#checkGrad)" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#emeraldGlow)"/>

  <!-- Secondary verification dot at the check corner -->
  <circle cx="246" cy="318" r="4" fill="#a7f3d0"/>
</svg>
